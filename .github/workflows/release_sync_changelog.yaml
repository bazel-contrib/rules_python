name: "Release: Sync Changelog"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'The Release Tracking Issue Number (e.g., 142)'
        required: false
        type: string
      comment_id:
        description: 'The ID of the comment that triggered this run (optional)'
        required: false
        type: string
  workflow_call:
    inputs:
      issue:
        description: 'The Release Tracking Issue Number (e.g., 142)'
        required: false
        type: string
      comment_id:
        description: 'The ID of the comment that triggered this run (optional)'
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync_changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-version: 1.20.0

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync Changelog to Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_ID: ${{ inputs.comment_id }}
          ISSUE: ${{ inputs.issue }}
        run: |
          ARGS=()
          if [ -n "$ISSUE" ]; then
            ISSUE="${ISSUE#\#}"
            ARGS+=("--issue=$ISSUE")
          fi
          if [ -n "$COMMENT_ID" ]; then
            ARGS+=("--triggering-comment=$COMMENT_ID")
          fi
          
          bazel run //tools/private/release -- sync-changelog \
            --remote origin \
            --no-dry-run \
            "${ARGS[@]}"
