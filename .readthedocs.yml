
version: 2

build:
  os: "ubuntu-24.04"
  commands:
    # Log RTD env vars to help debug builds without dumping noisy or sensitive
    # unrelated env vars.
    - env | grep '^READTHEDOC*'
    - dev/download_bazel.py
    # download_bazel.py installs into ~/.cache/bazelisk/bin, which is not on
    # RTD's default PATH. Symlink into $READTHEDOCS_VIRTUALENV_PATH/bin, which
    # is on PATH across steps.
    - >-
      mkdir -p "$READTHEDOCS_VIRTUALENV_PATH/bin" &&
      ln -s ~/.cache/bazelisk/bin/bazel "$READTHEDOCS_VIRTUALENV_PATH/bin/bazel"
    # Verify bazel is on PATH and log the version in its own build step without
    # starting the Bazel server JVM.
    - bazel --version
    # Put the actual build behind a shell script because its easier to modify than
    # the yaml config.
    - docs/readthedocs_build.sh
